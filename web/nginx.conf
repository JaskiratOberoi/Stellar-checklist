# SMS web: static SPA + API proxy on one origin. Used by the staging/prod compose stacks
# (the Hostinger deployment uses public/.htaccess instead and talks to the API cross-origin).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 5m;

    # API and integration routes go to the API container on the compose network.
    location ~ ^/(api|export|ingest|health|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed assets: cache forever. The shell and service worker: never.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SPA routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
