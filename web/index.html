  <body>
    <!--
      DIRECTION CONTRACT · SMS web · Operate mode · code-led · 2026-09-21
      THESIS: A bench tally sheet made digital, not a dashboard. The count sheet is the product; Today is
        two session rows and one action. Refuses the KPI-card home and the metric-tile grid.
      OWN-WORLD: Infinity's world. Cool clinical ground (#fbfdff → #eaf4f8, faint 32px grid on the login),
        ink #0f2233, the cyan→teal→blue helix gradient (#06b6d4/#0d9488/#2563eb) on primary actions and the
        mark, teal washes for active state; status only as amber/red/green with a drawn glyph and a word.
        Two identities stand together in every bar: the Infinity helix + SMS wordmark, a divider, then the
        Noble Diagnostics roundel (navy, knocked to white in dark). Never merged into one lockup.
        Source Sans 3 for UI, Source Code Pro for codes, lots, serials and column figures. Hairline
        dividers, 10px radii, section bands per instrument, no nested cards, tabular numerals in tables.
      STORY: the tech sees what is due, taps the one button, walks the bench top-to-bottom entering
        packs + loose against a faint expected value, gets a summary of variances, submits in two minutes.
      FIRST VIEWPORT (phone): BU name and local date in the bar; Opening and Closing as two rows with a
        status chip and time; one full-width primary button for the session that is due; then alerts as
        plain rows (low stock, expiring lots, missed counts). Bottom tab bar: Today, Count, Stock, Alerts, More.
      FORM: dense grouped sheet with sticky section headers and progress; signature interaction is the
        submit summary sheet rising from the bottom with variances listed for a last look.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict,
        DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
